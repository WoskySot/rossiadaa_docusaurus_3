# ===========================================================================
#  EdgeOne Makers（原 EdgeOne Pages）自动部署
#  参考：https://pages.edgeone.ai/zh/document/using-github-actions
#        https://pages.edgeone.ai/zh/document/edgeone-cli （CI/CD 一节）
#
#  放置位置必须是：<仓库根目录>/.github/workflows/deploy.yml
#  （GitHub 只认这个路径：.github/workflows/ 目录下、扩展名为 .yml/.yaml）
#
#  一次性准备（在 GitHub 仓库页面上操作）：
#    1) Settings → Secrets and variables → Actions → Secrets
#       新增 Repository secret： Name = EDGEONE_API_TOKEN
#                              Secret = EdgeOne API Token
#       位置：EdgeOne Makers 控制台 → API Token → 创建 API Token（可设 1 天~1 年有效期）
#    2) 确认下面 EDGEONE_PROJECT_NAME 与控制台里的「项目名称」一字不差。
#       ⚠️ 名字写错不会报错：CLI 会照着这个新名字**新建一个项目**，
#          你以为在更新的那个站点始终不动 —— 这是"推了 main 但线上没变"的头号成因。
#    3) （可选）如果部署报的站点不对，去 Settings → Secrets and variables → Actions
#       → Variables 加一个 EDGEONE_SITE = china 或 global，让流程显式指定站点。
#
#  凭据是怎么传的（读 CLI 1.6.41 产物得到的取值顺序）：
#        -t/--token 参数  →  env EDGEONE_PAGES_API_TOKEN  →  ./.edgeone/auth.json  →  系统凭据库（edgeone login）
#    注意这个环境变量叫 EDGEONE_PAGES_API_TOKEN（CLI 的原生名），不是 EDGEONE_API_TOKEN
#    （后者只是本仓库给 Secret 起的名字，两回事）。下面把 Secret 映射到原生名、
#    再用 -t 引用同一个值：兼容 CLI 的所有取值分支，又不必把 token 写死在命令行里。
#
#  看到 "Deployment failed: Invalid EDGEONE_PAGES_API_TOKEN. Please provide a valid
#  API token with --token or login first with edgeone login" 时：
#    这句由 CLI 的鉴权探测抛出——它会把同一个 token 分别打到中国站与国际站的接口，
#    **两个都失败**才报这句。所以它不代表"没传 token"，也不代表"站点选错"，
#    而是"这个 token 没通过鉴权"：值为空/带空白、已过期、已被删除、属于别的账号。
#    注意上一行 CLI 会先打印 "Using provided API token for deployment..."，
#    说明 token 确实被收到了 —— 问题在值本身。
# ===========================================================================

name: Build and Deploy

# ① 向 main 分支推送时自动构建并部署
on:
  push:
    branches:
      - main
  # ② 支持手动触发：改完配置想立刻验证时，到 Actions 页面点 Run workflow，
  #    不用先造一个空提交
  workflow_dispatch:

# 同一分支只保留最新一次部署：连续推送时，旧的那次会被取消，
# 避免两个构建互相覆盖（旧产物最后落地是最容易踩的坑）
concurrency:
  group: edgeone-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # ⚠️ 与控制台「项目名称」逐字一致。名字写错 = 新建项目，不报错。
      EDGEONE_PROJECT_NAME: rossiyadaa
      # Docusaurus 的构建输出目录（本项目用默认值 build/）
      OUTPUT_DIR: ./build
      # 固定 CLI 版本：CI 要可复现，也因为 `@latest` 每次都从 npm 拉最新版，
      # 上游一发新版你这次部署的行为就可能变。升级时改这里。
      EDGEONE_CLI_VERSION: '1.6.41'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0' # 官方文档示例版本；本项目 engines 要求 >=20
          cache: yarn # 读取 yarn.lock 做依赖缓存

      - name: Check API token is present and clean
        # 只做确定性检查（不发网络请求）：没配好的话，几秒钟就失败，
        # 不必等两分钟构建跑完才在部署阶段看含糊的 CLI 报错。
        env:
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          set -euo pipefail
          # token 用环境变量传进来，绝不内插进脚本正文：Secret 里若含 " ` $ 等字符，
          # 内插到 shell 脚本里会被二次解释、取值被破坏。
          if [ -z "${EDGEONE_PAGES_API_TOKEN:-}" ]; then
            echo "::error title=没拿到 token::env EDGEONE_PAGES_API_TOKEN 为空。请确认仓库 Secret 名为 EDGEONE_API_TOKEN——官方文档同一页里两处示例分别写了 EDGEONE_API_TOKEN 与 EDGEONE_TOKEN，抄错名字只会静默得到空值。"
            exit 1
          fi
          TOKEN=$(printf '%s' "$EDGEONE_PAGES_API_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$TOKEN"
          if [ "$TOKEN" != "$EDGEONE_PAGES_API_TOKEN" ]; then
            echo "::warning title=Secret 里有空白字符::多半是复制粘贴时带进了换行或空格。CLI 的部署路径不会自动去掉它（只有部分内部路径会 trim），等于拿一个坏 token 去鉴权。这里已代为去除，但建议到 Secrets 页面重建一个干净的。"
          fi
          echo "token 长度 ${#TOKEN}（只打印长度，不打印内容）"

      - name: Install dependencies
        # 这里用 yarn 而不用文档里的 npm install，原因见下：
        # 本仓库同时存在 yarn.lock（新，含 @easyops-cn/docusaurus-search-local）
        # 与 package-lock.json（旧，不含该依赖）。两者不同步时
        # `npm ci` 会直接报错退出，`npm install` 会重写锁文件、每次装的版本可能不同。
        # 想改用 npm 的话：先删掉 yarn.lock、跑一次 `npm install` 让 package-lock.json
        # 与新依赖同步并提交，再把下面两行换成 `npm ci` / `npm run build`。
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build

      - name: Deploy to EdgeOne Makers
        id: deploy
        env:
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          # 站点/区域：两个变量名都指向仓库变量 EDGEONE_SITE（china 或 global）。
          #  - EDGEONE_SITE     → 决定命令行要不要加 --site
          #  - EDGEONE_PAGES_API_REGION → CLI 内部解析区域时读的就是它
          #    （不设时 CLI 会按出口 IP 自行判定，GitHub 的 runner 多在海外；
          #      某些内部调用还会在"有 token 但没区域"时直接退化成 china）
          EDGEONE_SITE: ${{ vars.EDGEONE_SITE }}
          EDGEONE_PAGES_API_REGION: ${{ vars.EDGEONE_SITE }}
        run: |
          set -euo pipefail
          TOKEN=$(printf '%s' "$EDGEONE_PAGES_API_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$TOKEN"

          SITE_ARG=""
          if [ -n "${EDGEONE_SITE:-}" ]; then
            SITE_ARG="--site $EDGEONE_SITE"
            echo "使用仓库变量指定的站点：$EDGEONE_SITE"
          fi

          # --yes 是必需的：CI 里没有交互终端，npx 遇到未安装的包会卡在确认提示上。
          # 末尾开头的 `set +e` 是为了自己处理退出码，好把常见报错翻译成人话。
          set +e
          OUTPUT=$(npx --yes "edgeone@$EDGEONE_CLI_VERSION" makers deploy "$OUTPUT_DIR" \
            -n "$EDGEONE_PROJECT_NAME" \
            -t "$TOKEN" \
            -e production $SITE_ARG 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"

          if [ "$CODE" -ne 0 ]; then
            case "$OUTPUT" in
              *"Invalid EDGEONE_PAGES_API_TOKEN"*)
                echo "::error title=token 未通过鉴权::CLI 把这个 token 分别打到中国站与国际站的接口，两处都失败才报这句（所以这不是'站点选错'）。常见原因：① Secret 里放的不是 token 或值为空 ② token 已过期/已被删除 ③ token 属于另一个账号 ④ 值里混进了空白字符。可到控制台重建一个（建议设有效期）。" ;;
              *"Missing EDGEONE_PAGES_API_TOKEN"*)
                echo "::error title=没拿到 token::这条提示只读环境变量 EDGEONE_PAGES_API_TOKEN，说明它没被传进来。检查 Secret 名与 env 映射。" ;;
              *"Please run \`edgeone login\`"*|*"not authenticated"*)
                echo "::error title=未认证且无法交互登录::CI 里不能开浏览器登录。请改用 API token；若你自己的 runner 上没有 CI 环境变量，加上 CI=true 或 EDGEONE_NON_INTERACTIVE=1 让 CLI 走非交互分支。" ;;
              *) echo "::error title=部署失败::退出码 $CODE，完整输出见上。" ;;
            esac
            exit "$CODE"
          fi

          URL=$(printf '%s\n' "$OUTPUT" | grep -o 'https://[^[:space:]]*' | tail -n 1 || true)
          if [ -n "$URL" ]; then
            {
              echo "### EdgeOne 部署完成 :rocket:"
              echo ""
              echo "| 项目 | 访问地址 |"
              echo "| --- | --- |"
              echo "| \`$EDGEONE_PROJECT_NAME\` | $URL |"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "EDGEONE_DEPLOY_URL=$URL" >> "$GITHUB_OUTPUT"
          fi
